[package]
name = "guhit-studio"
description = "Guhit Studio desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "guhit_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
guhit-app = { workspace = true }
guhit-mcp = { workspace = true }
guhit-model = { workspace = true }
# tokio: the broadcast error types of the app event forwarder.
tokio = { version = "1", features = ["sync"] }

# The updater only exists on desktop. Mobile targets skip it, as the plugin
# docs prescribe, so the crate still builds there.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
