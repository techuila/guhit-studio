name: Bug report
description: Something in Guhit Studio does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search the existing issues first.

        **Security problems:** do not report them here. Use the private form described in [SECURITY.md](https://github.com/techuila/guhit-studio/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did you see? Add a screenshot or a screen recording if it helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that shows the problem, starting from a new project or the sample bungalow if you can.
      placeholder: |
        1. Open the Sample bungalow template
        2. Press W and draw a wall
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Guhit Studio version
      description: The release you downloaded, for example 0.4.0. If you built from source, give the commit.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      options:
        - macOS, Apple silicon
        - macOS, Intel
        - Windows 11
        - Windows 10
        - Browser with the dev bridge (pnpm bridge and pnpm dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - 2D editor
        - 3D view
        - Walk mode
        - Plumbing or electrical
        - AI copilot
        - MCP or an agent
        - Live session
        - Export or import
        - Installer or updater
        - Other
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project file or logs
      description: If the bug depends on a project, attach it as a `.guhit` bundle. Remove anything private first. Paste any error text from the app or the terminal. Never paste an API key.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and did not find this one.
          required: true
        - label: This is not a security problem. I have read SECURITY.md.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
