name: release

# Cutting a release is one push of a tag. Steps and the optional secret:
# docs/RELEASING.md.
#
# build.yml stays on branch pushes and pull requests only, so a tag push
# builds here and nowhere else.
on:
  push:
    tags: ["v*"]

# tauri-action creates the GitHub release and uploads the bundles to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate bundles. The updater picks the
          # right one by target and arch from latest.json. `download` is the
          # fixed file name the website links to, under
          # releases/latest/download/, so the links never change.
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            bundle: dmg
            download: Guhit-Studio-mac-apple-silicon.dmg
          - os: macos-latest
            label: macos-x64
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            bundle: dmg
            download: Guhit-Studio-mac-intel.dmg
          - os: windows-latest
            label: windows-x64
            target: ""
            args: ""
            bundle: nsis
            download: Guhit-Studio-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Update files are signed with the minisign key. Without the secret the
      # release still ships every installer, it only leaves out latest.json
      # and the .sig files, so installed copies are not offered this version
      # as an automatic update.
      - name: Check for the updater key
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No updater key::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has installers but no update files. See docs/RELEASING.md."
          fi

      # macOS: sign with the Developer ID certificate and notarize, when the
      # secrets are there (docs/RELEASING.md). They have the same names as in
      # the other Aliteo Mac apps, so one certificate and one routine serve
      # them all. Without them the app stays ad-hoc signed
      # (bundle.macOS.signingIdentity "-") and Gatekeeper blocks its first
      # open. Tauri counts a variable that is set but empty as present, so
      # each one goes into the environment only when it has a value. The
      # identity only has to be part of the certificate's name.
      - name: Set up Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::warning title=Not signed::MACOS_CERT_P12 is not set, so the macOS app is ad-hoc signed and macOS blocks its first open. See docs/RELEASING.md."
            exit 0
          fi
          # One line of base64, whatever wrapping the secret was saved with.
          CERTIFICATE=$(printf '%s' "$CERTIFICATE" | tr -d '\r\n ')
          echo "::add-mask::$CERTIFICATE"
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=${IDENTITY:-Developer ID Application}"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=Signed, not notarized::APPLE_ID, APPLE_APP_PASSWORD or APPLE_TEAM_ID is not set, so macOS still blocks the first open. See docs/RELEASING.md."
          fi

      # Builds, signs the update artifacts when the key is there, then creates
      # the release and uploads the bundles. There is no Windows certificate
      # yet (docs/RELEASING.md).
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated with --ci, so it has no password. The
          # variable must still be set, to an empty string.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Guhit Studio ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # Writes latest.json next to the bundles. This is the file the
          # updater endpoint in tauri.conf.json points at.
          uploadUpdaterJson: ${{ steps.updater.outputs.on == 'true' }}
          # Windows: update through the NSIS setup.exe rather than the MSI.
          # An MSI update cannot replace a running installation cleanly.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.on != 'true' && '--config ''{"bundle":{"createUpdaterArtifacts":false}}''' || '' }}

      # Tauri notarizes and staples the app and signs the DMG, but does not
      # notarize the DMG. A downloaded DMG is checked on its own, so notarize
      # and staple it too, check it the way a fresh Mac would, and replace the
      # copy tauri-action already uploaded (GitHub turns the spaces in its
      # name into dots).
      - name: Notarize the DMG
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find target -path "*/bundle/dmg/*.dmg" -type f | head -n 1)
          if [ -z "$dmg" ]; then
            echo "::error::No DMG found under target/"
            exit 1
          fi
          out=$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json)
          status=$(printf '%s' "$out" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')
          if [ "$status" != "Accepted" ]; then
            id=$(printf '%s' "$out" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))')
            echo "::error::Notarization of the DMG ended with status '$status'"
            [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          spctl --assess --type exec -v "$(find target -maxdepth 6 -path "*/bundle/macos/*.app" -type d | head -n 1)"
          name=$(basename "$dmg" | tr ' ' '.')
          cp "$dmg" "$name"
          gh release upload "${{ github.ref_name }}" "$name" --clobber --repo "${{ github.repository }}"

      # The website's download buttons link straight to
      # releases/latest/download/<name>, which starts the download without
      # showing GitHub. Upload each installer again under its fixed name.
      - name: Upload the installer under its fixed download name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file=$(find target -path "*/bundle/${{ matrix.bundle }}/*" \( -name "*.dmg" -o -name "*-setup.exe" \) -type f | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::No ${{ matrix.bundle }} installer found under target/"
            exit 1
          fi
          echo "Found $file"
          cp "$file" "${{ matrix.download }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.download }}" --clobber --repo "${{ github.repository }}"
